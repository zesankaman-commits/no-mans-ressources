<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>No Man's Ressources</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230a0e1a'/%3E%3Cpath d='M -26,40 A 30,30 0 0 1 26,40' transform='translate(32,22)' fill='none' stroke='%2300d4ff' stroke-width='4'/%3E%3Crect x='24' y='38' width='16' height='4' rx='2' fill='%2300d4ff' opacity='0.8'/%3E%3Cpolygon points='32,8 10,42 54,42' fill='%23001a2e' stroke='%2300d4ff' stroke-width='2.5'/%3E%3Cpolygon points='32,8 10,42 32,42' fill='%2300d4ff' opacity='0.1'/%3E%3Ccircle cx='32' cy='8' r='4' fill='%2300d4ff'/%3E%3Ccircle cx='6' cy='40' r='3' fill='%23ffd700'/%3E%3Ccircle cx='58' cy='40' r='3' fill='%23ffd700'/%3E%3C/svg%3E">
<title>No Man's Ressources</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Exo+2:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg1:#0a0e1a;--bg2:#0d1525;--acc:#00d4ff;--acc2:#ff6b35;--gold:#ffd700;
  --green:#00ff9d;--text:#c8d8e8;--muted:#6a8099;--card:rgba(13,21,37,0.97);
  --border:rgba(0,212,255,0.25);--border2:rgba(0,212,255,0.12);
}
html,body{height:100%;font-family:'Exo 2',sans-serif;background:var(--bg1);color:var(--text);overflow-x:hidden}
.welcome-toast{
  position:fixed;top:1.2rem;left:50%;transform:translateX(-50%) translateY(-120px);
  z-index:9998;background:rgba(10,14,26,.97);
  border:1px solid rgba(0,212,255,.4);border-radius:6px;
  padding:1.1rem 1.5rem;max-width:420px;width:90%;
  box-shadow:0 4px 32px rgba(0,212,255,.15);
  transition:transform .5s cubic-bezier(.22,1,.36,1),opacity .5s ease;
  opacity:0;pointer-events:none;
}
.welcome-toast.show{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto;}
.welcome-toast.hide{transform:translateX(-50%) translateY(-120px);opacity:0;}
.wt-signal{font-size:.65rem;letter-spacing:.25em;color:var(--acc);text-transform:uppercase;margin-bottom:.5rem}
.wt-title{font-family:'Orbitron',monospace;font-size:.85rem;color:var(--text);margin-bottom:.5rem;font-weight:500}
.wt-body{font-size:.78rem;color:var(--muted);line-height:1.6}
.wt-stats{display:flex;gap:1rem;margin-top:.65rem;padding-top:.65rem;border-top:1px solid rgba(0,212,255,.12)}
.wt-stat{text-align:center;flex:1}
.wt-stat-n{font-family:'Orbitron',monospace;font-size:.95rem;color:var(--acc);font-weight:700}
.wt-stat-l{font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
.wt-close{position:absolute;top:.6rem;right:.8rem;background:none;border:none;color:var(--muted);cursor:pointer;font-size:1rem;line-height:1}
.wt-close:hover{color:var(--text)}
.home-counter{font-size:.72rem;color:var(--muted);text-align:center;margin-top:.75rem;letter-spacing:.05em}
.home-counter span{color:var(--acc);font-weight:500}
.bg-wrap{position:fixed;inset:0;z-index:0}
.bg-slide{position:absolute;inset:0;opacity:0;transition:opacity 1.8s ease;background-size:cover;background-position:center}
.bg-slide.active{opacity:1}
.bg-slide:nth-child(1){background:url('https://fmvmkqzsjsreigerakkp.supabase.co/storage/v1/object/public/images/backgrounds/backgrounds%201.avif') center/cover no-repeat,radial-gradient(ellipse at 30% 50%,#1a0533 0%,#0a0e1a 100%)}
.bg-slide:nth-child(2){background:url('https://fmvmkqzsjsreigerakkp.supabase.co/storage/v1/object/public/images/backgrounds/backgrounds%202.png') center/cover no-repeat,radial-gradient(ellipse at 70% 30%,#001a2e 0%,#0a0e1a 100%)}
.bg-slide:nth-child(3){background:url('https://fmvmkqzsjsreigerakkp.supabase.co/storage/v1/object/public/images/backgrounds/backgrounds%203.png') center/cover no-repeat,radial-gradient(ellipse at 50% 70%,#001a0e 0%,#0a0e1a 100%)}
.bg-slide:nth-child(4){background:url('https://fmvmkqzsjsreigerakkp.supabase.co/storage/v1/object/public/images/backgrounds/backgrounds%204.png') center/cover no-repeat,radial-gradient(ellipse at 20% 80%,#0a1a2e 0%,#0a0e1a 100%)}
.stars{position:fixed;inset:0;z-index:1;pointer-events:none;
  background-image:radial-gradient(1px 1px at 8% 12%,rgba(255,255,255,.7) 0%,transparent 100%),
  radial-gradient(1px 1px at 22% 38%,rgba(255,255,255,.5) 0%,transparent 100%),
  radial-gradient(1px 1px at 38% 8%,rgba(255,255,255,.8) 0%,transparent 100%),
  radial-gradient(1px 1px at 55% 55%,rgba(255,255,255,.4) 0%,transparent 100%),
  radial-gradient(1px 1px at 72% 22%,rgba(255,255,255,.6) 0%,transparent 100%),
  radial-gradient(1px 1px at 83% 72%,rgba(255,255,255,.7) 0%,transparent 100%),
  radial-gradient(1px 1px at 91% 42%,rgba(255,255,255,.3) 0%,transparent 100%),
  radial-gradient(1px 1px at 4% 83%,rgba(255,255,255,.5) 0%,transparent 100%),
  radial-gradient(1px 1px at 48% 88%,rgba(255,255,255,.4) 0%,transparent 100%),
  radial-gradient(2px 2px at 33% 68%,rgba(0,212,255,.4) 0%,transparent 100%),
  radial-gradient(2px 2px at 63% 13%,rgba(255,107,53,.3) 0%,transparent 100%)}
.overlay{position:fixed;inset:0;z-index:2;background:rgba(5,10,20,.55)}
.app{position:relative;z-index:3;min-height:100vh;display:flex;flex-direction:column}
.page{display:none;flex:1;flex-direction:column}
.page.active{display:flex}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:.75rem 1.25rem;
  background:rgba(5,10,20,.7);border-bottom:1px solid var(--border2);flex-wrap:wrap;gap:.5rem}
.topbar-logo{font-family:'Orbitron',monospace;font-size:.9rem;color:var(--acc);letter-spacing:.08em;cursor:pointer}
.topbar-logo span{color:var(--acc2)}
.topbar-right{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.tb-user{font-size:.78rem;color:var(--muted)}
.tb-user strong{color:var(--acc)}
.btn{padding:.45rem 1.1rem;border-radius:3px;cursor:pointer;font-family:'Exo 2',sans-serif;
  font-size:.78rem;letter-spacing:.07em;font-weight:500;text-transform:uppercase;transition:all .2s;border:1px solid transparent}
.btn-outline{background:transparent;border-color:var(--acc);color:var(--acc)}
.btn-outline:hover{background:rgba(0,212,255,.1)}
.btn-fill{background:var(--acc);border-color:var(--acc);color:#0a0e1a}
.btn-fill:hover{background:#00b8d9}
.btn-acc2{background:transparent;border-color:var(--acc2);color:var(--acc2)}
.btn-acc2:hover{background:rgba(255,107,53,.1)}
.btn-gold{background:transparent;border-color:var(--gold);color:var(--gold)}
.btn-gold:hover{background:rgba(255,215,0,.1)}
.btn-sm{padding:.3rem .75rem;font-size:.72rem}
.btn-danger{background:transparent;border-color:#ff4444;color:#ff4444}
.btn-danger:hover{background:rgba(255,68,68,.1)}
.icon-btn{width:34px;height:34px;border-radius:50%;background:rgba(0,212,255,.07);
  border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .2s;color:var(--acc);font-size:1rem}
.icon-btn:hover{background:rgba(0,212,255,.18)}
.home-content{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1rem 4rem}
.home-title{font-family:'Orbitron',monospace;font-size:clamp(1.8rem,6vw,3.2rem);font-weight:700;
  color:var(--acc);letter-spacing:.1em;text-align:center;text-shadow:0 0 40px rgba(0,212,255,.35)}
.home-title span{color:var(--acc2)}
.home-sub{font-size:.8rem;letter-spacing:.25em;color:var(--muted);text-transform:uppercase;margin-top:.5rem;text-align:center}
.search-wrap{width:100%;max-width:560px;position:relative;margin:2rem 0 1.25rem}
.search-box{width:100%;padding:.85rem 3.2rem .85rem 1.2rem;background:rgba(0,0,0,.65);
  border:1px solid var(--border);border-radius:4px;color:var(--text);
  font-family:'Exo 2',sans-serif;font-size:1rem;outline:none;transition:border-color .2s}
.search-box:focus{border-color:var(--acc)}
.search-box::placeholder{color:var(--muted)}
.search-submit{position:absolute;right:0;top:0;bottom:0;width:46px;background:var(--acc);
  border:none;border-radius:0 4px 4px 0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}
.search-submit:hover{background:#00b8d9}
.ac-drop{position:absolute;top:100%;left:0;right:0;z-index:200;background:#0d1525;
  border:1px solid var(--border);border-top:none;border-radius:0 0 4px 4px;display:none;max-height:220px;overflow-y:auto}
.ac-drop.show{display:block}
.ac-opt{padding:.55rem 1.1rem;cursor:pointer;font-size:.88rem;transition:background .15s;
  display:flex;align-items:center;gap:8px;border-bottom:1px solid rgba(0,212,255,.06)}
.ac-opt:last-child{border-bottom:none}
.ac-opt:hover,.ac-opt.focused{background:rgba(0,212,255,.09)}
.ac-new{color:var(--acc2);font-style:italic}
.home-btns{display:flex;gap:.9rem;flex-wrap:wrap;justify-content:center}
.modal-bg{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;padding:1rem}
.modal-bg.show{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:1.75rem;
  width:100%;max-width:400px;position:relative;max-height:90vh;overflow-y:auto}
.modal-title{font-family:'Orbitron',monospace;font-size:.95rem;color:var(--acc);margin-bottom:1.4rem;letter-spacing:.08em}
.modal-close{position:absolute;top:.9rem;right:1rem;background:none;border:none;
  color:var(--muted);cursor:pointer;font-size:1.3rem;line-height:1;transition:color .2s}
.modal-close:hover{color:var(--text)}
.fg{margin-bottom:.85rem}
.fl{display:block;font-size:.7rem;color:var(--muted);margin-bottom:.35rem;letter-spacing:.08em;text-transform:uppercase}
.req{color:var(--acc2)}
.fi{width:100%;padding:.6rem .85rem;background:rgba(0,0,0,.55);border:1px solid var(--border);
  border-radius:3px;color:var(--text);font-family:'Exo 2',sans-serif;font-size:.88rem;outline:none;transition:border-color .2s}
.fi:focus{border-color:var(--acc)}
.fi::placeholder{color:var(--muted)}
select.fi option{background:#0d1525}
.fi-right{text-align:right}
.input-sfx{display:flex;align-items:center;background:rgba(0,0,0,.55);border:1px solid var(--border);border-radius:3px;transition:border-color .2s}
.input-sfx:focus-within{border-color:var(--acc)}
.input-sfx .fi{border:none;background:transparent;flex:1;text-align:right;padding-right:.4rem}
.input-sfx .fi:focus{border:none}
.sfx-lbl{padding:0 .7rem 0 .3rem;font-size:.85rem;color:var(--acc);font-weight:500;white-space:nowrap}
.fg-row{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
@media(max-width:500px){.fg-row{grid-template-columns:1fr}}
@media(max-width:600px){
  .home-title{font-size:1.6rem}
  .search-wrap{margin:1.2rem 0 1rem}
  .topbar{padding:.5rem .75rem}
  .topbar-logo{font-size:.8rem}
  .grid-2{grid-template-columns:1fr}
  .results-page,.forms-page,.admin-page{padding:.75rem .6rem 3rem}
  .res-card{padding:1rem}
  .glyph-pal{grid-template-columns:repeat(8,1fr);gap:3px}
  .glyph-slot{width:32px;height:32px}
  .wt-stats{flex-wrap:wrap;gap:.5rem}
  .admin-tabs{gap:.3rem}
  .admin-tab{padding:.35rem .65rem;font-size:.68rem}
  .form-card{padding:1rem}
  .admin-row{flex-direction:column;align-items:flex-start;gap:.4rem}
  .btn-sm{padding:.3rem .65rem;font-size:.7rem}
  .home-btns{gap:.6rem}
  .topbar-right{gap:.4rem}
  .modal{padding:1.25rem}
  .wt-stat-n{font-size:.8rem}
}
.form-msg{font-size:.78rem;color:var(--muted);margin-top:.75rem;text-align:center}
.form-msg a{color:var(--acc);cursor:pointer}
.form-err{font-size:.78rem;color:var(--acc2);margin-top:.5rem;text-align:center}
.dup-warn{font-size:.72rem;color:var(--acc2);margin-top:3px;display:none}
.opt-note{font-size:.62rem;color:var(--muted);font-style:italic;margin-left:4px;text-transform:none;letter-spacing:0}
.results-page{padding:1.25rem 1rem 4rem;max-width:780px;margin:0 auto;width:100%}
.res-card{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:1.4rem;margin-bottom:1.5rem}
.res-header{display:flex;align-items:center;gap:1rem;margin-bottom:.9rem}
.res-icon{width:60px;height:60px;border-radius:4px;background:rgba(0,212,255,.07);
  border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:1.9rem;flex-shrink:0}
.res-name{font-family:'Orbitron',monospace;font-size:1.15rem;font-weight:700;color:var(--acc)}
.badges{display:flex;gap:.6rem;margin-top:.35rem;flex-wrap:wrap}
.badge{font-size:.68rem;padding:2px 7px;border-radius:2px;text-transform:uppercase;letter-spacing:.05em}
.badge-type{background:rgba(255,215,0,.1);color:var(--gold);border:1px solid rgba(255,215,0,.22)}
.badge-val{background:rgba(0,255,157,.08);color:var(--green);border:1px solid rgba(0,255,157,.2)}
.res-desc{font-size:.83rem;color:var(--muted);line-height:1.6;margin-bottom:.9rem}
.craft-box{background:rgba(0,0,0,.3);border-radius:3px;padding:.65rem .9rem;margin-bottom:.9rem}
.craft-title{font-size:.67rem;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:.45rem}
.craft-items{display:flex;flex-wrap:wrap;gap:.45rem}
.craft-tag{font-size:.78rem;color:var(--acc2);background:rgba(255,107,53,.08);padding:2px 8px;border-radius:2px;border:1px solid rgba(255,107,53,.2)}
.note-tip{background:rgba(255,215,0,.05);border-left:3px solid var(--gold);padding:.55rem .9rem;
  font-size:.76rem;color:rgba(255,215,0,.8);margin-bottom:1.1rem;border-radius:0 3px 3px 0;font-style:italic}
.sec-label{font-size:.67rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);
  margin-bottom:.7rem;display:flex;align-items:center;gap:.5rem}
.sec-label::after{content:'';flex:1;height:1px;background:var(--border)}
.grid-2{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:.65rem;margin-bottom:1.1rem}
.sta-card{background:rgba(0,0,0,.4);border:1px solid rgba(0,212,255,.14);border-radius:4px;padding:.7rem;transition:border-color .2s}
.sta-card:hover{border-color:rgba(0,212,255,.38)}
.pla-card{background:rgba(0,0,0,.4);border:1px solid rgba(255,107,53,.14);border-radius:4px;padding:.7rem;transition:border-color .2s}
.pla-card:hover{border-color:rgba(255,107,53,.38)}
.card-name{font-size:.83rem;font-weight:500;margin-bottom:.25rem}
.card-sub{font-size:.7rem;color:var(--muted);margin-bottom:.3rem}
.price-buy{font-size:.88rem;font-weight:600;color:var(--green)}
.price-sell{font-size:.88rem;font-weight:600;color:var(--acc2)}
.pla-biome{font-size:.7rem;color:var(--acc2)}
.no-data{font-size:.82rem;color:var(--muted);font-style:italic}
.back-btn{display:flex;align-items:center;gap:.5rem;background:none;border:none;color:var(--muted);
  cursor:pointer;font-family:'Exo 2',sans-serif;font-size:.82rem;transition:color .2s}
.back-btn:hover{color:var(--acc)}
.forms-page{padding:1.25rem 1rem 4rem;max-width:660px;margin:0 auto;width:100%}
.form-card{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:1.4rem}
.form-title{font-family:'Orbitron',monospace;font-size:.92rem;color:var(--acc);margin-bottom:1.2rem;letter-spacing:.08em}
.fsec{margin-bottom:1.1rem}
.fsec-title{font-size:.67rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);
  margin-bottom:.7rem;padding-bottom:.35rem;border-bottom:1px solid var(--border2)}
.add-line-btn{font-size:.76rem;color:var(--acc);background:none;border:1px dashed var(--border);
  border-radius:3px;padding:.38rem .85rem;cursor:pointer;width:100%;transition:all .2s;
  letter-spacing:.05em;font-family:'Exo 2',sans-serif;margin-top:.3rem}
.add-line-btn:hover{background:rgba(0,212,255,.06)}
.craft-row{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem}
.craft-row .ac-wrap{flex:1;position:relative}
.craft-qty{width:100px;flex-shrink:0}
.remove-btn{width:26px;height:26px;border-radius:50%;background:rgba(255,107,53,.1);
  border:1px solid rgba(255,107,53,.28);color:var(--acc2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:.95rem;flex-shrink:0}
.remove-btn:hover{background:rgba(255,107,53,.22)}
.sta-res-row{background:rgba(0,0,0,.3);border:1px solid var(--border2);border-radius:4px;padding:.7rem;margin-bottom:.55rem}
.sta-res-hdr{display:flex;align-items:center;gap:.5rem;margin-bottom:.55rem}
.sta-res-nm{font-size:.83rem;font-weight:500;flex:1;color:var(--acc)}
.type-row{display:flex;gap:.45rem;margin-bottom:.45rem;flex-wrap:wrap}
.type-tog{font-size:.7rem;padding:3px 11px;border-radius:2px;cursor:pointer;
  letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--border2);
  background:transparent;color:var(--muted);transition:all .15s;font-family:'Exo 2',sans-serif}
.type-tog.on-buy{border-color:var(--green);color:var(--green);background:rgba(0,255,157,.08)}
.type-tog.on-sell{border-color:var(--acc2);color:var(--acc2);background:rgba(255,107,53,.08)}
.price-row{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.price-lbl{font-size:.73rem;color:var(--muted);width:88px;flex-shrink:0}
.res-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:.45rem}
.res-tag{background:rgba(0,212,255,.07);border:1px solid var(--border);border-radius:3px;
  padding:2px 7px;font-size:.78rem;display:flex;align-items:center;gap:5px}
.res-tag button{background:none;border:none;color:var(--acc2);cursor:pointer;font-size:.9rem;line-height:1;padding:0}
.ac-wrap{position:relative}
.glyph-pal{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-bottom:.75rem}
.glyph-btn{aspect-ratio:1;border-radius:5px;background:rgba(0,0,0,.5);
  border:1px solid var(--border2);cursor:pointer;display:flex;flex-direction:column;
  align-items:center;justify-content:center;transition:all .15s;padding:5px}
.glyph-btn:hover{border-color:var(--acc);background:rgba(0,212,255,.09)}
.glyph-btn.used{border-color:rgba(0,212,255,.5);background:rgba(0,212,255,.07)}
.glyph-chr{font-size:1.3rem;line-height:1}
.glyph-id{font-size:.55rem;color:var(--muted);margin-top:2px}
.glyph-seq{display:flex;gap:5px;flex-wrap:wrap;align-items:center;min-height:50px;
  background:rgba(0,0,0,.4);border:1px solid var(--border);border-radius:3px;padding:6px 8px;margin-bottom:.45rem}
.glyph-slot{width:40px;height:40px;border-radius:5px;border:1px solid var(--acc);
  background:rgba(0,212,255,.07);display:flex;align-items:center;justify-content:center;
  font-size:.85rem;cursor:pointer;padding:5px}
.glyph-slot:hover{background:rgba(255,107,53,.14);border-color:var(--acc2)}
.glyph-empty{color:var(--muted);font-size:.75rem;font-style:italic}
.glyph-zoom-tip{
  position:fixed;z-index:9000;pointer-events:none;
  background:rgba(10,14,26,.97);border:1px solid var(--acc);
  border-radius:6px;padding:.6rem .8rem;
  display:none;flex-direction:column;align-items:center;gap:.35rem;
  box-shadow:0 0 20px rgba(0,212,255,.25);
}
.glyph-zoom-tip.visible{display:flex;}
.glyph-zoom-tip img{width:72px;height:72px;object-fit:contain}
.glyph-zoom-tip span{font-size:.72rem;color:var(--acc);text-align:center;max-width:100px}
.glyph-acts{display:flex;gap:.45rem;margin-bottom:.35rem}
.ga-btn{font-size:.7rem;padding:.3rem .7rem;border-radius:3px;cursor:pointer;
  font-family:'Exo 2',sans-serif;letter-spacing:.05em;text-transform:uppercase;transition:all .2s}
.ga-ok{background:rgba(0,255,157,.08);border:1px solid rgba(0,255,157,.28);color:var(--green)}
.ga-ok:hover{background:rgba(0,255,157,.18)}
.ga-rst{background:rgba(255,107,53,.07);border:1px solid rgba(255,107,53,.22);color:var(--acc2)}

async function loadDB(){
  showLoading(true);
  try{
    const [res,sta,pla,usr,rep,contrib]=await Promise.all([sbGet('resources'),sbGet('stations'),sbGet('planets'),sbGet('users'),sbGet('reports'),sbGet('contributions')]);
    DB.resources=res.map(sbToRes);
    DB.stations=sta.map(sbToSta);
    DB.planets=pla.map(sbToPla);
    DB.users=usr.map(sbToUser);
    DB.reports=rep.map(sbToReport);
    DB.contributions=contrib.map(sbToContrib);
    if(DB.resources.length===0) await seedInitialData();

  showLoading(false);
}

function showResults(r){
  showPage('results');
  const buyStations=[],sellStations=[];
  DB.stations.forEach(s=>{
    const entry=s.resources&&s.resources.find(x=>x.name===r.name);
    if(!entry)return;
    if(entry.buy!==null&&entry.buy!=='')buyStations.push({...s,price:Number(entry.buy)});
    if(entry.sell!==null&&entry.sell!=='')sellStations.push({...s,price:Number(entry.sell)});
  });
  buyStations.sort((a,b)=>a.price-b.price);
  sellStations.sort((a,b)=>b.price-a.price);
  const planets=DB.planets.filter(p=>p.resources&&p.resources.includes(r.name));

  const iconHTML=resIcon(r,'48px');
  const buyHTML=buyStations.slice(0,5).map(s=>`<div class="sta-card" style="cursor:pointer" onclick="showStationDetail(${s.id})"><div class="card-name">${s.name}</div><div class="card-sub">${s.system} — ${s.galaxy}</div><div class="price-buy">${Number(s.price).toLocaleString()}${UNITS_SYMBOL}</div></div>`).join('')||`<div class="no-data">Aucune station répertoriée</div>`;

  const plaHTML=planets.slice(0,5).map(p=>`<div class="pla-card" style="cursor:pointer" onclick="showPlanetDetail(${p.id})"><div class="card-name">🪐 ${p.name}</div><div class="card-sub">${p.system}</div><div class="pla-biome">${p.biome||''}</div></div>`).join('')||`<div class="no-data">Aucune planète répertoriée</div>`;
  const reportBtn=currentUser?`<button class="report-btn" onclick="showModal('report','${r.name}')">🚩 Signaler une erreur</button>`:'';

  document.getElementById('results-content').innerHTML=`
    <div class="res-card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:.5rem">
        <div class="res-header"><div class="res-icon" style="background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center">${iconHTML}</div>
          <div><div class="res-name">${r.name}</div>
            <div class="badges">${r.type?`<span class="badge badge-type">${r.type}</span>`:''}${r.value?`<span class="badge badge-val">${Number(r.value).toLocaleString()}${UNITS_SYMBOL}</span>`:''}</div>
          </div>
        </div>
        <div style="display:flex;gap:.5rem;flex-wrap:wrap;align-items:center">${editBtn}${reportBtn}</div>

async function changePassword(){
  const oldPwd=document.getElementById('p-old').value;
  const newPwd=document.getElementById('p-new').value;
  const confirm=document.getElementById('p-confirm').value;
  const err=document.getElementById('p-err');
  const ok=document.getElementById('p-ok');
  err.style.display='none';ok.style.display='none';
  if(!oldPwd||!newPwd||!confirm){err.textContent='Tous les champs sont requis.';err.style.display='block';return;}
  if(newPwd!==confirm){err.textContent='Les mots de passe ne correspondent pas.';err.style.display='block';return;}
  if(newPwd.length<6){err.textContent='Le mot de passe doit faire au moins 6 caractères.';err.style.display='block';return;}
  // Vérifier l'ancien mdp
  if(currentUser.email==='admin@nms.com'){
    if(oldPwd!=='admin'){err.textContent='Mot de passe actuel incorrect.';err.style.display='block';return;}
  } else {
    const user=DB.users.find(u=>u.email===currentUser.email);
    if(!user||user.pwd!==oldPwd){err.textContent='Mot de passe actuel incorrect.';err.style.display='block';return;}
    // Mettre à jour dans Supabase
    await sbUpdate('users',user.id,{pwd:newPwd});
    user.pwd=newPwd;
  }
  ok.style.display='block';
  document.getElementById('p-old').value='';
  document.getElementById('p-new').value='';
  document.getElementById('p-confirm').value='';
  setTimeout(()=>ok.style.display='none',3000);
}
async function uploadBackground(input){
  const file=input.files[0];if(!file)return;
  const status=document.getElementById('bg-upload-status');
  if(status)status.textContent='Envoi en cours...';
  try{
    const ext=file.name.split('.').pop();
    const fname='bg_'+Date.now()+'.'+ext;
    const res=await fetch(SB_URL+'/storage/v1/object/images/backgrounds/'+fname,{
      method:'POST',
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':file.type,'x-upsert':'true'},
      body:file
    });
    if(res.ok){
      const url=SB_IMG+'/backgrounds/'+fname;
      if(status)status.textContent='✓ Image uploadée !';
      // Appliquer comme fond actif
      const slides=document.querySelectorAll('.bg-slide');
      slides.forEach(s=>s.classList.remove('active'));
      const target=slides[bgIdx%slides.length];
      target.style.background="url('"+url+"') center/cover no-repeat,#0a0e1a";
      target.classList.add('active');
      setTimeout(()=>{if(status)status.textContent='';},3000);
    } else {if(status)status.textContent='Erreur upload.';}
  }catch(e){if(status)status.textContent='Erreur : '+e.message;}
}
async function uploadResourceImage(input,resId){
  const file=input.files[0];if(!file)return;
  const statusEl=document.getElementById('res-upload-status');
  if(statusEl)statusEl.textContent='Envoi en cours...';
  try{
    const ext=file.name.split('.').pop();
    const r=DB.resources.find(x=>x.id===resId);
    const fname=(r?r.name.replace(/[^a-z0-9]/gi,'_'):Date.now())+'.'+ext;
    const res=await fetch(SB_URL+'/storage/v1/object/images/resources/'+encodeURIComponent(fname),{
      method:'POST',
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':file.type,'x-upsert':'true'},
      body:file
    });
    if(res.ok){
      const url=SB_IMG+'/resources/'+encodeURIComponent(fname);
      await sbUpdate('resources',resId,{icon:url});
      if(r){r.icon=url;}
      if(statusEl)statusEl.textContent='✓ Image uploadée !';
      const preview=document.getElementById('rf-icon-preview');
      const img=document.getElementById('rf-icon-img');
      if(img){img.src=url;img.dataset.url=url;}
      if(preview)preview.style.display='flex';
      setTimeout(()=>{if(statusEl)statusEl.textContent='';},3000);
    } else {if(statusEl)statusEl.textContent='Erreur upload.';}
  }catch(e){if(statusEl)statusEl.textContent='Erreur : '+e.message;}
}

function doLogin(){
  const email=document.getElementById('m-email').value.trim();
  const pwd=document.getElementById('m-pwd').value;
  const remember=document.getElementById('m-remember')&&document.getElementById('m-remember').checked;
  if(email==='admin@nms.com'&&pwd==='admin'){setUser({name:'Admin',email,role:'admin',remember});closeModal();return;}
  const user=DB.users.find(u=>u.email===email&&u.pwd===pwd);
  if(!user){document.getElementById('m-err').textContent='Email ou mot de passe incorrect.';return;}
  setUser({name:user.name,email:user.email,role:user.role||'user',remember});closeModal();
}
async function doRegister(){
  const name=document.getElementById('m-name').value.trim();
  const email=document.getElementById('m-email').value.trim();
  const pwd=document.getElementById('m-pwd').value;
  if(!name||!email||!pwd){document.getElementById('m-err').textContent='Tous les champs sont requis.';return;}
  if(email==='admin@nms.com'){document.getElementById('m-err').textContent='Cet email est réservé.';return;}
  if(DB.users.find(u=>u.email===email)){document.getElementById('m-err').textContent='Cet email est déjà utilisé.';return;}
  const newUser=await sbInsert('users',{name,email,pwd,role:'user',created_at:new Date().toISOString().split('T')[0]});
  if(newUser&&newUser[0]){DB.users.push(sbToUser(newUser[0]));setUser({name,email,role:'user'});closeModal();}
  else{document.getElementById('m-err').textContent='Erreur lors de l\'inscription. Réessayez.';}
}
function setUser(u,isNew=false){
  currentUser=u;renderTopbar();
  if(u.remember){
    try{localStorage.setItem('nms-session',JSON.stringify({name:u.name,email:u.email,role:u.role}));}catch(e){}
  }
  setTimeout(()=>showWelcome(u),400);
}
function doLogout(){
  currentUser=null;
  try{localStorage.removeItem('nms-session');}catch(e){}
  renderTopbar();goHome();
}
function tryRestoreSession(){
  try{
    const s=localStorage.getItem('nms-session');
    if(!s)return;
    const u=JSON.parse(s);
    if(u&&u.email){
      // Vérifier que l'utilisateur existe encore dans la DB
      if(u.email==='admin@nms.com'){currentUser={...u,remember:true};renderTopbar();return;}
      const found=DB.users.find(x=>x.email===u.email);
      if(found){currentUser={name:found.name,email:found.email,role:found.role,remember:true};renderTopbar();}
    }
  }catch(e){}
}
function setBG(idx,gradient){
  const slides=document.querySelectorAll('.bg-slide');
  // Si on a 8 fonds maintenant, on les gère dynamiquement
  if(gradient){
    // Appliquer sur le slide actif
    slides.forEach(s=>s.classList.remove('active'));
    const target=slides[idx%slides.length];
    target.style.background=gradient;
    target.classList.add('active');
    bgIdx=idx%slides.length;
  } else {
    slides.forEach(s=>s.classList.remove('active'));
    slides[idx%slides.length].classList.add('active');
    bgIdx=idx%slides.length;
  }
  closeModal();
}

    return`<div class="glyph-slot" onclick="removeGlyph('${ctx}',${i})" title="Retirer — ${g?g.n:''}">${glyphImgOrEmoji(g,'28px')}</div>`;
  }).join('')+`<span style="font-size:.68rem;color:var(--muted);margin-left:auto">${seq.length} glyphe(s)</span>`;
  document.querySelectorAll('#'+ctx+'-pal .glyph-btn').forEach(b=>b.classList.toggle('used',seq.includes(b.id.split('-gb-')[1])));
}
function validateGlyph(ctx){
  if(!GS[ctx].seq.length)return;GS[ctx].validated=true;
  const v=document.getElementById(ctx+'-val');if(!v)return;
  v.style.display='flex';
  v.innerHTML=`<span class="gv-ok">✓</span>`+GS[ctx].seq.map(id=>{const g=GLYPHS.find(x=>x.id===id);return`<div class="gv-slot">${glyphImgOrEmoji(g,'20px')}</div>`;}).join('')+`<span class="gv-edit" onclick="editGlyph('${ctx}')">Modifier</span>`;
  const seqEl=document.getElementById(ctx+'-seq');if(seqEl)seqEl.style.display='none';
  const acts=v.previousElementSibling;if(acts)acts.style.display='none';
  const pal=document.getElementById(ctx+'-pal');if(pal)pal.style.opacity='.3';
}
function editGlyph(ctx){
  GS[ctx].validated=false;
  const v=document.getElementById(ctx+'-val');if(v)v.style.display='none';
  const seqEl=document.getElementById(ctx+'-seq');if(seqEl)seqEl.style.display='flex';
  const pal=document.getElementById(ctx+'-pal');if(pal)pal.style.opacity='1';
  if(v&&v.previousElementSibling)v.previousElementSibling.style.display='flex';
}
function resetGlyph(ctx){
  GS[ctx]={seq:[],validated:false};renderGlyph(ctx);
  const v=document.getElementById(ctx+'-val');if(v)v.style.display='none';
  const seqEl=document.getElementById(ctx+'-seq');if(seqEl)seqEl.style.display='flex';
  const pal=document.getElementById(ctx+'-pal');if(pal)pal.style.opacity='1';
}

function acResourceIcon(){
  const val=document.getElementById('rf-icon').value.toLowerCase().trim();
  const drop=document.getElementById('rf-icon-ac');
  if(!val||val.length<1){drop.classList.remove('show');return;}
  const filtered=SB_RESOURCES_LIST
    .filter(r=>r.name.toLowerCase().includes(val))
    .sort((a,b)=>a.name.localeCompare(b.name,'fr'))
    .slice(0,10);
  if(!filtered.length){
    drop.innerHTML=`<div class="ac-opt" style="color:var(--muted);font-style:italic;cursor:default">Aucune image trouvée pour "${val}"</div>`;
    drop.classList.add('show');return;
  }
  drop.innerHTML=filtered.map(r=>`<div class="ac-opt" onmousedown="pickResourceIcon('${r.name.replace(/'/g,"\\'")}','${r.url}')">
    <img src="${r.url}" style="width:28px;height:28px;object-fit:contain;border-radius:2px" onerror="this.style.opacity='.2'">
    <span>${r.name}</span>
  </div>`).join('');
  drop.classList.add('show');
}
function pickResourceIcon(name,url){
  document.getElementById('rf-icon').value=name;
  document.getElementById('rf-icon-ac').classList.remove('show');
  const preview=document.getElementById('rf-icon-preview');
  const img=document.getElementById('rf-icon-img');
  const nm=document.getElementById('rf-icon-name');
  if(preview&&img){
    img.src=url;img.dataset.url=url;
    if(nm)nm.textContent=name;
    preview.style.display='flex';
  }
}
function clearResourceIcon(){
  document.getElementById('rf-icon').value='';
  const preview=document.getElementById('rf-icon-preview');
  if(preview)preview.style.display='none';
}
function acClimat(){
  const val=document.getElementById('pf-climat');
  if(!val)return;
  let drop=document.getElementById('pf-climat-ac');
  if(!drop){
    drop=document.createElement('div');drop.className='ac-drop';drop.id='pf-climat-ac';
    val.parentNode.style.position='relative';val.parentNode.appendChild(drop);
  }
  const v=val.value.toLowerCase().trim();
  const list=getClimatList();
  const filtered=list.filter(x=>x.toLowerCase().includes(v));
  if(!filtered.length){drop.classList.remove('show');return;}
  drop.innerHTML=filtered.map(x=>`<div class="ac-opt" onmousedown="pickAC('pf-climat','pf-climat-ac','${x}')">${x}</div>`).join('');
  drop.classList.add('show');
}
function getClimatList(){
  const climats=[...new Set(DB.planets.filter(p=>p.climat).map(p=>p.climat))];
  return climats.sort((a,b)=>a.localeCompare(b,'fr'));
}
function acSimple(inputId,dropId,list){
  const val=document.getElementById(inputId).value.toLowerCase().trim();
  const drop=document.getElementById(dropId);if(!drop)return;
  const filtered=list.filter(x=>x.toLowerCase().includes(val));
  const exactExists=list.some(x=>x.toLowerCase()===val);
  let html=filtered.map(x=>`<div class="ac-opt" onmousedown="pickAC('${inputId}','${dropId}','${x}')">${x}</div>`).join('');
  if(val&&!exactExists)html+=`<div class="ac-opt ac-new" onmousedown="addNewToList('${inputId}','${dropId}')">+ Ajouter "${document.getElementById(inputId).value}"</div>`;
  if(!html){drop.classList.remove('show');return;}
  drop.innerHTML=html;drop.classList.add('show');
}
function addNewToList(inputId,dropId){
  const val=document.getElementById(inputId).value.trim();if(!val)return;
  if(inputId.includes('sent')&&!SENTINELS.includes(val))SENTINELS.push(val);
  else if(inputId.includes('flora')&&!FLORAS.includes(val))FLORAS.push(val);
  else if(inputId.includes('fauna')&&!FAUNAS.includes(val))FAUNAS.push(val);
  document.getElementById(dropId).classList.remove('show');
}
function pickAC(inputId,dropId,val){
  const el=document.getElementById(inputId);if(el)el.value=val;
  const drop=document.getElementById(dropId);if(drop)drop.classList.remove('show');
}
function acSystems(inputId,dropId){

async function updateResource(id){
  const r=DB.resources.find(x=>x.id===id);
  if(!r)return;
  const type=v('rf-type');
  const value=v('rf-value');
  const desc=v('rf-desc');
  const iconImg=document.getElementById('rf-icon-img');
  const iconUrl=iconImg&&iconImg.dataset.url?iconImg.dataset.url:null;
  const crafts=[];
  document.querySelectorAll('[id^="cr-"]').forEach(row=>{
    const idNum=row.id.split('cr-')[1];
    const nm=v('cri-'+idNum);const qty=v('crq-'+idNum);
    if(nm)crafts.push({name:nm,qty:parseInt(qty)||1});
  });
  const upd={};
  if(type)upd.type=type;
  if(value)upd.value=parseInt(value);
  if(desc)upd.description=desc;
  if(crafts.length)upd.craft=crafts;
  if(iconUrl){upd.icon=iconUrl;r.icon=iconUrl;}
  await sbUpdate('resources',id,upd);
  if(type)r.type=type;if(value)r.value=value;if(desc)r.desc=desc;if(crafts.length)r.craft=crafts;
  // Logger les champs modifiés
  const fields=[];
  if(type)fields.push('type:'+type);
  if(value)fields.push('valeur:'+value);
  if(desc)fields.push('description');
  if(crafts.length)fields.push('fabrication');
  if(iconUrl)fields.push('image');
  if(fields.length)await logContribution('resource',id,r.name,'modification',fields.join(', '));
  const ok=document.getElementById('rf-ok');
  if(ok){ok.textContent='✓ Ressource mise à jour !';ok.style.display='block';setTimeout(()=>ok.style.display='none',3000);}
}

      staResTemp=[];
      s.resources&&s.resources.forEach(r=>{
        staResTemp.push({name:r.name,buy:r.buy!==undefined?r.buy:null,sell:r.sell!==undefined?r.sell:null});
      });
      staResPending={name:null,buy:null,sell:null};
      renderStaResPending();
      renderStaRes();
      const btn=document.querySelector('#add-form-content .submit-btn');
      if(btn){btn.textContent='Mettre à jour la station';btn.onclick=()=>updateStation(id);}
      const fc=document.querySelector('#add-form-content .form-card');
      if(fc){const info=document.createElement('div');
        info.style.cssText='background:rgba(0,212,255,.07);border:1px solid rgba(0,212,255,.2);border-radius:4px;padding:.55rem .9rem;font-size:.78rem;color:var(--acc);margin-bottom:1rem';
        info.textContent='✏ Mode complétion — vous pouvez ajouter ou modifier les informations.';
        fc.insertBefore(info,fc.firstChild);}
    },60);
  },50);
}
async function updateStation(id){
  const s=DB.stations.find(x=>x.id===id);if(!s)return;
  const galaxy=v('sf-galaxy');const system=v('sf-system');
  if(galaxy)s.galaxy=galaxy;
  if(system)s.system=system;
  if(GS.sta.seq.length)s.glyphs=[...GS.sta.seq];
  if(staResTemp.length){
    staResTemp.forEach(nr=>{
      const existing=s.resources.find(x=>x.name===nr.name);
      if(existing){if(nr.buy!==null&&nr.buy!=='')existing.buy=nr.buy;if(nr.sell!==null&&nr.sell!=='')existing.sell=nr.sell;}
      else{s.resources.push(nr);}
    });
  }
  const updSta={};
  if(galaxy)updSta.galaxy=galaxy;if(system)updSta.system_name=system;
  if(GS.sta.seq.length)updSta.glyphs=[...GS.sta.seq];
  if(staResTemp.length)updSta.resources=s.resources;
  await sbUpdate('stations',id,updSta);
  await logContribution('station',id,s.name,'modification',Object.keys(updSta).join(', '));
  const ok=document.getElementById('sf-ok');
  if(ok){ok.textContent='✓ Station mise à jour !';ok.style.display='block';setTimeout(()=>ok.style.display='none',3000);}
}
function goEditPlanet(id){
  const p=DB.planets.find(x=>x.id===id);if(!p)return;
  showPage('add');currentAddTab='planet';updateAddTabs();
  setTimeout(()=>{
    renderAddForm();
    setTimeout(()=>{
      const nameEl=document.getElementById('pf-name');
      if(nameEl){nameEl.value=p.name;nameEl.disabled=true;nameEl.style.opacity='.6';}
      const fields=[['pf-galaxy',p.galaxy],['pf-system',p.system],['pf-biome',p.biome],
        ['pf-climat',p.climat],['pf-sent',p.sentinels],['pf-flora',p.flora],['pf-fauna',p.fauna]];
      fields.forEach(([id,val])=>{const el=document.getElementById(id);if(el&&val)el.value=val;});
      if(p.glyphs&&p.glyphs.length){GS.pla.seq=[...p.glyphs];renderGlyph('pla');}
      p.resources&&p.resources.forEach(r=>{if(!plaResTemp.includes(r))plaResTemp.push(r);});
      renderPlaRes();
      const btn=document.querySelector('#add-form-content .submit-btn');
      if(btn){btn.textContent='Mettre à jour la planète';btn.onclick=()=>updatePlanet(id);}
      const fc=document.querySelector('#add-form-content .form-card');
      if(fc){const info=document.createElement('div');
        info.style.cssText='background:rgba(0,212,255,.07);border:1px solid rgba(0,212,255,.2);border-radius:4px;padding:.55rem .9rem;font-size:.78rem;color:var(--acc);margin-bottom:1rem';
        info.textContent='✏ Mode complétion — vous pouvez ajouter ou modifier les informations.';
        fc.insertBefore(info,fc.firstChild);}
    },60);
  },50);
}
async function updatePlanet(id){
  const p=DB.planets.find(x=>x.id===id);if(!p)return;
  const fields=[['pf-galaxy','galaxy'],['pf-system','system'],['pf-biome','biome'],
    ['pf-climat','climat'],['pf-sent','sentinels'],['pf-flora','flora'],['pf-fauna','fauna']];
  const updPla={};
  fields.forEach(([elId,key])=>{const val=v(elId);if(val){p[key]=val;const sbKey=key==='system'?'system_name':key==='sentinels'?'sentinels':key;updPla[sbKey]=val;}});
  if(GS.pla.seq.length){p.glyphs=[...GS.pla.seq];updPla.glyphs=[...GS.pla.seq];}
  if(plaResTemp.length){plaResTemp.forEach(r=>{if(!p.resources.includes(r))p.resources.push(r);});updPla.resources=p.resources;}
  await sbUpdate('planets',id,updPla);
  await logContribution('planet',id,p.name,'modification',Object.keys(updPla).join(', '));
  const ok=document.getElementById('pf-ok');
  if(ok){ok.textContent='✓ Planète mise à jour !';ok.style.display='block';setTimeout(()=>ok.style.display='none',3000);}
}
function showAdminTab(tab){
  document.querySelectorAll('.admin-tab').forEach((b,i)=>{
    const ids=['users','resources','stations','planets','reports'];
    b.classList.toggle('active',ids[i]===tab);
  });
  renderAdminTab(tab);
}

        <div class="ar-meta">${s.system} — ${s.galaxy}</div>
        <div class="ar-by">par ${s.addedBy||'?'} · ${s.addedAt||''}</div>
        <button class="btn btn-sm btn-danger" onclick="deleteStation(${s.id})">Supprimer</button>
      </div>`).join(''):`<div class="empty-state">Aucune station</div>`}</div>`;
  }else if(tab==='planets'){
    content.innerHTML=`<div class="admin-card">${DB.planets.length?DB.planets.map(p=>`
      <div class="admin-row">
        <div class="ar-name" style="cursor:pointer;color:var(--acc)" onclick="showPlanetDetail(${p.id})">🪐 ${p.name}</div>

        <div class="ar-by">par ${p.addedBy||'?'} · ${p.addedAt||''}</div>
        <button class="btn btn-sm btn-danger" onclick="deletePlanet(${p.id})">Supprimer</button>
      </div>`).join(''):`<div class="empty-state">Aucune planète</div>`}</div>`;

function deleteUser(id){if(!confirm('Supprimer cet utilisateur ?'))return;sbDelete('users',id).then(()=>{DB.users=DB.users.filter(u=>u.id!==id);renderAdminTab('users');});}
function deleteResource(id){if(!confirm('Supprimer cette ressource ?'))return;sbDelete('resources',id).then(()=>{DB.resources=DB.resources.filter(r=>r.id!==id);renderAdminTab('resources');});}
function deleteStation(id){if(!confirm('Supprimer cette station ?'))return;sbDelete('stations',id).then(()=>{DB.stations=DB.stations.filter(s=>s.id!==id);renderAdminTab('stations');});}
function deletePlanet(id){if(!confirm('Supprimer cette planète ?'))return;sbDelete('planets',id).then(()=>{DB.planets=DB.planets.filter(p=>p.id!==id);renderAdminTab('planets');});}
function resolveReport(i){const rep=DB.reports[i];sbUpdate('reports',rep.id,{status:'Résolu'}).then(()=>{DB.reports[i].status='Résolu';renderAdminTab('reports');});}
function deleteReport(i){const rep=DB.reports[i];if(!confirm('Supprimer ce signalement ?'))return;sbDelete('reports',rep.id).then(()=>{DB.reports.splice(i,1);renderAdminTab('reports');});}
document.addEventListener('click',e=>{
